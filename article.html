document.addEventListener('DOMContentLoaded',()=>{
  const body=document.getElementById('articleBody');
  if(body&&body.querySelector('.info-block')){
    const headings=[...body.querySelectorAll('.report-opening h2,.info-block h2')];
    const guide=document.createElement('details');guide.className='reader-guide';
    const summary=document.createElement('summary');summary.textContent='本篇導讀｜跳到你想看的部分';guide.append(summary);
    const list=document.createElement('ol');
    headings.forEach((heading,index)=>{
      if(!heading.id)heading.id='reader-section-'+(index+1);
      const item=document.createElement('li'),link=document.createElement('a');
      link.href=location.pathname+location.search+'#'+heading.id;
      link.textContent=heading.textContent.trim();
      item.append(link);list.append(item);
    });
    guide.append(list);body.prepend(guide);
    const take=body.querySelector('.take h2');
    if(take){
      const label=document.createElement('small');label.className='reader-opinion-label';
      label.textContent='編輯觀點｜以下屬分析與判斷，並非已確認事實。';
      take.after(label);
    }
  }
  const related=document.getElementById('articleRelated');
  if(related){
    const esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    const id=window.AISON_ARTICLE_ID||new URLSearchParams(location.search).get('id')||'';
    const all=(window.AISON_NEWS||[]).slice().sort((a,b)=>(Number(a.rank)||999)-(Number(b.rank)||999));
    const current=all.find(n=>n.id===id);
    const same=current?all.filter(n=>n.id!==id&&n.category===current.category):[];
    const fallback=all.filter(n=>n.id!==id&&!same.includes(n));
    const picks=[...same,...fallback].slice(0,3);
    related.innerHTML=picks.map(n=>`<a class="article-related-card" href="news/${encodeURIComponent(n.id)}.html"><small>${esc(n.category||'AI NEWS')}</small><b>${esc(n.title)}</b><span>繼續閱讀 →</span></a>`).join('');
  }
});
</script><script>if("serviceWorker" in navigator){navigator.serviceWorker.register("service-worker.js?v=20260909-context1").catch(()=>{})}</script></body></html>
