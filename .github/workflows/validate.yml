name: Validate AIson V3
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate phase scripts
        run: |
          node --check story-updates.js
          node --check archive.js
          python -m py_compile tools/patch_share_meta.py
      - name: Install social card renderer
        run: |
          python -m pip install --disable-pip-version-check "Pillow>=11,<13"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - name: Build AIson
        env:
          AISON_REQUIRE_SOCIAL_CARDS: '1'
        run: python tools/build.py
      - name: Build AIson LIVE
        run: python tools/build_live.py
      - name: Verify generated current edition
        shell: bash
        run: |
          set -euo pipefail
          test -f assets/social/daily-latest.jpg
          test -f data/news.js
          test -f data/search-index.json
          test -f data/live.js
          grep -q 'window.AISON_LIVE' data/live.js
          grep -q '2026-' data/news.js
      - name: Verify lightweight archive
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'id="archiveLoadMore"' archive.html
          grep -q 'archive.js' archive.html
          if grep -q 'data/news.js' archive.html; then echo 'archive must not load full news payload' >&2; exit 1; fi
          if grep -q 'app.js' archive.html; then echo 'archive must use dedicated lightweight renderer' >&2; exit 1; fi
          python - <<'PY'
          import json,sys
          sys.path.insert(0,'tools')
          from build import load_news
          rows=json.load(open('data/search-index.json',encoding='utf-8'))
          news=load_news()
          assert len(rows)==len(news), (len(rows),len(news))
          assert len({r['id'] for r in rows})==len(rows)
          assert all({'id','rank','title','excerpt','category','tags','date'} <= set(r) for r in rows)
          print(f'lightweight search index ok: {len(rows)} stories')
          PY
      - name: Verify dated social preview patch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/aison-share-preview
          mkdir -p /tmp/aison-share-preview
          cp index.html daily.html /tmp/aison-share-preview/
          python tools/patch_share_meta.py /tmp/aison-share-preview
          grep -q 'assets/social/daily-20' /tmp/aison-share-preview/index.html
          grep -q 'assets/social/daily-20' /tmp/aison-share-preview/daily.html
      - run: git diff --exit-code -- . ':!data/status.js' ':!data/news.js' ':!data/search-index.json'
      - name: Check latest verified source links
        run: python tools/check_sources.py
