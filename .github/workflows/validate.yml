name: Validate AIson V3
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate phase scripts
        run: |
          node --check story-updates.js
          node --check archive.js
          node --check topics.js
          node --check weekly.js
          node --check lite-home.js
          node --check engagement.js
          node --check analytics.js
          node --check live.js
          node --check live-timeline.js
          python -m py_compile tools/patch_share_meta.py tools/build_light_payloads.py tools/editorial.py tools/check_freshness.py tools/check_storyline_classifications.py
      - name: Install social card renderer
        run: |
          python -m pip install --disable-pip-version-check "Pillow>=11,<13"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - name: Build AIson
        env:
          AISON_REQUIRE_SOCIAL_CARDS: '1'
        run: python tools/build.py
      - name: Build AIson LIVE
        run: python tools/build_live.py
      - name: Verify generated current edition
        shell: bash
        run: |
          set -euo pipefail
          test -f assets/social/daily-latest.jpg
          test -f data/news.js
          test -f data/search-index.json
          test -f data/editorial.js
          test -f data/live.js
          grep -q 'window.AISON_EDITORIAL' data/editorial.js
          grep -q 'window.AISON_LIVE' data/live.js
          grep -q '2026-' data/news.js
      - name: Verify editorial metadata and privacy analytics
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'data/editorial.js' engagement.js
          grep -q 'analytics.js' engagement.js
          grep -q "'data/editorial.js'" service-worker.js
          grep -q "'analytics.js'" service-worker.js
          grep -q 'respectDNT' analytics.js
          grep -q 'credentials:' analytics.js
          grep -q 'AIson Daily Freshness Sentinel' .github/workflows/healthcheck.yml
          grep -q 'tools/check_freshness.py' .github/workflows/healthcheck.yml
          python - <<'PY'
          import json,pathlib,re
          site=json.load(open('content/site.json',encoding='utf-8'))
          analytics=site.get('analytics',{})
          assert analytics.get('enabled') is True
          assert analytics.get('provider') == 'posthog'
          assert analytics.get('projectKey','').startswith('phc_')
          assert analytics.get('apiHost') == 'https://us.i.posthog.com'
          assert analytics.get('respectDNT') is True
          text=pathlib.Path('data/editorial.js').read_text(encoding='utf-8').strip()
          m=re.match(r'window\.AISON_EDITORIAL\s*=\s*(\{.*\});?$',text,re.S)
          assert m, 'invalid editorial payload'
          meta=json.loads(m.group(1))
          latest=sorted(pathlib.Path('content/daily').glob('*.json'),key=lambda p:p.stem)[-1]
          items=json.load(open(latest,encoding='utf-8'))
          assert meta['date']==latest.stem
          assert len(meta['top3Ids'])==3 and len(set(meta['top3Ids']))==3
          assert set(meta['top3Ids']) <= {x['id'] for x in items}
          assert len(meta['threeThemes'])==3
          assert all({'title','summary','watch'} <= set(t) for t in meta['threeThemes'])
          print('editorial metadata ok:',meta['date'],meta.get('source'))
          PY
      - name: Verify source freshness checker against latest stored edition
        shell: bash
        run: |
          set -euo pipefail
          edition="$(find content/daily -maxdepth 1 -name '20??-??-??.json' -printf '%f\n' | sed 's/\.json$//' | sort | tail -1)"
          test -n "$edition"
          python tools/check_freshness.py --source-only --date "$edition"
      - name: Verify AIson LIVE timeline
        shell: bash
        run: |
          set -euo pipefail
          test -f live.html
          test -f live-timeline.js
          grep -q 'AIson LIVE' live.html
          grep -q 'id="liveTimeline"' live.html
          grep -q 'data/live.js' live.html
          grep -q 'live-timeline.js' live.html
          grep -q "href='live.html'" live.js
          grep -q "'live.html'" service-worker.js
          grep -q "'live-timeline.js'" service-worker.js
      - name: Verify topic storylines
        shell: bash
        run: |
          set -euo pipefail
          python tools/check_storyline_classifications.py
          grep -q 'id="storylineHub"' topics.html
          grep -q 'id="topicStoryline"' topics.html
          grep -q 'id="topicTimeline"' topics.html
          grep -q 'AIson STORYLINES' topics.html
          grep -q 'storylineCandidates' topics.js
          grep -q 'renderTimeline' topics.js
          grep -q 'LATEST DEVELOPMENT' topics.js
          grep -q "'topics.js'" service-worker.js
          python - <<'PY'
          import json
          rows=json.load(open('data/search-index.json',encoding='utf-8'))
          defs={
            'OpenAI':['openai','chatgpt','gpt'],
            'NVIDIA':['nvidia','blackwell','rubin','h100','h200'],
            'Google':['google','gemini','deepmind'],
            'Anthropic':['anthropic','claude'],
            'Meta':['meta','llama'],
            'SpaceX':['spacex','starlink','starship'],
            'Apple':['apple','apple intelligence'],
          }
          counts={}
          for name,aliases in defs.items():
              count=0
              for row in rows:
                  hay=' '.join([str(row.get('title','')),str(row.get('excerpt','')),str(row.get('category','')),*map(str,row.get('tags',[]))]).lower()
                  if row.get('category')==name or name in row.get('tags',[]) or any(a in hay for a in aliases):
                      count+=1
              counts[name]=count
          assert any(v>=2 for v in counts.values()), counts
          print('topic storylines available:',{k:v for k,v in counts.items() if v>=2})
          PY
      - name: Verify homepage newsroom
        shell: bash
        run: |
          set -euo pipefail
          test -f home-newsroom-v4.css
          test -f engagement.js
          test -f engagement.css
          grep -q 'home-newsroom-v4.css' index.html
          grep -q 'id="editorialFeature"' index.html
          grep -q 'id="newsGrid"' index.html
          grep -q 'id="aison-live"' index.html
          grep -q 'id="newsletter"' index.html
          grep -q 'frontpage-grid' lite-home.js
          grep -q 'today.slice(3)' app-editorial.js
          grep -q 'engagement.css' index.html
          grep -q 'engagement.js' index.html
          grep -q 'navigator.share' engagement.js
          grep -q 'navigator.clipboard' engagement.js
          grep -q 'aison-last-seen-edition-v1' engagement.js
          grep -q "'engagement.js'" service-worker.js
          grep -q "'engagement.css'" service-worker.js
          python - <<'PY'
          import sys
          sys.path.insert(0,'tools')
          import patch_share_meta as p
          edition=p.latest_edition()
          items=p.load_items(edition)
          title,description=p.share_copy(edition,items)
          assert len(items)==10
          assert title.startswith('AIson 今日 AI 10 件事｜')
          assert '今日焦點：' in description
          assert items[0]['title'][:10] in description
          print(title)
          print(description)
          PY
      - name: Verify lightweight archive
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'id="archiveLoadMore"' archive.html
          grep -q 'archive.js' archive.html
          if grep -q 'data/news.js' archive.html; then echo 'archive must not load full news payload' >&2; exit 1; fi
          if grep -q 'app.js' archive.html; then echo 'archive must use dedicated lightweight renderer' >&2; exit 1; fi
          python - <<'PY'
          import json,sys
          sys.path.insert(0,'tools')
          from build import load_news
          rows=json.load(open('data/search-index.json',encoding='utf-8'))
          news=load_news()
          assert len(rows)==len(news), (len(rows),len(news))
          assert len({r['id'] for r in rows})==len(rows)
          assert all({'id','rank','title','excerpt','category','tags','date'} <= set(r) for r in rows)
          print(f'lightweight search index ok: {len(rows)} stories')
          PY
      - name: Verify dated social preview patch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/aison-share-preview
          mkdir -p /tmp/aison-share-preview
          cp index.html daily.html /tmp/aison-share-preview/
          python tools/patch_share_meta.py /tmp/aison-share-preview
          grep -q 'assets/social/daily-20' /tmp/aison-share-preview/index.html
          grep -q 'assets/social/daily-20' /tmp/aison-share-preview/daily.html
          grep -q 'AIson 今日 AI 10 件事｜20' /tmp/aison-share-preview/index.html
          grep -q '今日焦點：' /tmp/aison-share-preview/daily.html
      - run: git diff --exit-code -- . ':!data/status.js' ':!data/news.js' ':!data/search-index.json' ':!data/editorial.js' ':!data/site.js'
      - name: Build lightweight page payloads
        run: python tools/build_light_payloads.py
      - name: Verify split page payloads
        shell: bash
        run: |
          set -euo pipefail
          test -f data/latest.js
          grep -q 'data/latest.js' index.html
          grep -q 'data/latest.js' daily.html
          if grep -q 'data/news.js' index.html; then echo 'home must not load full news payload' >&2; exit 1; fi
          if grep -q 'data/news.js' daily.html; then echo 'daily must not load full news payload' >&2; exit 1; fi
          grep -q 'topics.js' topics.html
          if grep -q 'data/news.js' topics.html; then echo 'topics must not load full news payload' >&2; exit 1; fi
          if grep -q 'app.js' topics.html; then echo 'topics must use dedicated lightweight renderer' >&2; exit 1; fi
          if grep -q "'data/news.js'" service-worker.js; then echo 'service worker must not precache full news payload' >&2; exit 1; fi
          python - <<'PY'
          import json,re,pathlib
          text=pathlib.Path('data/latest.js').read_text(encoding='utf-8').strip()
          payload=text[len('window.AISON_NEWS = '):].rstrip(';')
          latest=json.loads(payload)
          assert len(latest)==10
          assert {int(x['rank']) for x in latest}==set(range(1,11))
          pages=list(pathlib.Path('news').glob('*.html'))
          assert pages
          pattern=re.compile(r'<script>window\.AISON_NEWS=(\[.*?\]);</script>',re.S)
          for page in pages:
              s=page.read_text(encoding='utf-8')
              assert 'src="data/news.js' not in s, page
              match=pattern.search(s)
              assert match, f'{page}: missing inline payload'
              embedded=json.loads(match.group(1))
              assert 1 <= len(embedded) <= 14, (page,len(embedded))
              assert len({row['id'] for row in embedded})==len(embedded), page
          print(f'split payloads ok: 10 latest / {len(pages)} parseable article payloads')
          PY
      - name: Check latest verified source links
        run: python tools/check_sources.py
