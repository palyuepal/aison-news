name: Validate AIson PWA Return Experience
on:
  push:
  pull_request:
jobs:
  pwa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript syntax
        run: |
          node --check pwa-return.js
          node --check engagement.js
          node --check service-worker.js
      - name: Verify returning-reader install rules
        shell: bash
        run: |
          set -euo pipefail
          grep -q "MIN_VISIT_DAYS=3" pwa-return.js
          grep -q "beforeinstallprompt" pwa-return.js
          grep -q "display-mode: standalone" pwa-return.js
          grep -q "navigator.standalone" pwa-return.js
          grep -q "Asia/Hong_Kong" pwa-return.js
          grep -q "pwa-return.js" engagement.js
          grep -q "pwa-return.js" service-worker.js
          grep -q "manifest.webmanifest" service-worker.js
          grep -q "request.mode==='navigate'" service-worker.js
          grep -q "LIVE_DATA" service-worker.js
          grep -q "SKIP_WAITING" service-worker.js
          python - <<'PY'
          import pathlib,re
          text=pathlib.Path('service-worker.js').read_text(encoding='utf-8')
          match=re.search(r"const CORE=\[(.*?)\];",text,re.S)
          assert match,'CORE list missing'
          items=re.findall(r"'([^']+)'",match.group(1))
          required={'offline.html','manifest.webmanifest','styles.css','visual-system-v2.css','pwa-return.js','assets/mascot-ui.webp'}
          assert required <= set(items), (required-set(items),items)
          assert len(items) <= 8, items
          forbidden={'assets/icon-512.png','assets/mascot.webp','data/search-index.json','data/latest.js','data/news.js','article.html','daily.html','live.html','weekly.html'}
          assert not (forbidden & set(items)), forbidden & set(items)
          assert 'lean-shell' in text
          print('lean PWA core ok:',len(items),items)
          PY
      - name: Validate manifest
        run: |
          python - <<'PY'
          import json
          m=json.load(open('manifest.webmanifest',encoding='utf-8'))
          assert m['id']=='./'
          assert m['scope']=='./'
          assert m['display']=='standalone'
          assert m['lang']=='zh-Hant-HK'
          assert len(m.get('shortcuts',[]))>=3
          urls={x['url'] for x in m['shortcuts']}
          assert {'./daily.html','./live.html','./weekly.html'} <= urls
          icons=m.get('icons',[])
          assert any('maskable' in x.get('purpose','') for x in icons)
          print('manifest ok:',m['name'],len(m['shortcuts']),'shortcuts')
          PY
