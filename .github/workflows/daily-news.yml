name: AIson Daily AI 10

on:
  schedule:
    # 00:00 UTC = 08:00 Hong Kong time
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aison-daily-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      AISON_MODEL: gpt-5.6-terra
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install OpenAI SDK
        run: python -m pip install --upgrade openai

      - name: Generate today's AI 10
        run: python tools/daily_update.py

      - name: Rebuild site data, RSS and sitemap
        run: python tools/build.py

      - name: Commit newsroom update
        run: |
          git config user.name "AIson News Bot"
          git config user.email "actions@users.noreply.github.com"
          git add content/news.json data/news.js data/search-index.json data/site.js data/status.js rss.xml sitemap.xml
          if git diff --cached --quiet; then
            echo "No content changes."
          else
            git commit -m "Daily AI 10: $(TZ=Asia/Hong_Kong date +%F)"
            git push
          fi

      # .github/workflows/pages.yml deploys every successful push to main.
