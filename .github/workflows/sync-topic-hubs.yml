name: Sync generated topic hubs

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/sync-topic-hubs.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install renderer dependencies
        run: |
          python -m pip install --disable-pip-version-check "Pillow>=11,<13"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk

      - name: Rebuild generated pages
        env:
          AISON_REQUIRE_SOCIAL_CARDS: "1"
        run: python tools/build.py

      - name: Commit generated topic hubs
        run: |
          if git diff --quiet -- topics/*.html; then
            echo "No topic hub changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add topics/*.html
          git commit -m "Sync generated topic hubs"
          git push origin HEAD:main
