name: One-shot sync generated topic hubs

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/sync-topic-hubs.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install renderer dependencies
        run: |
          python -m pip install --disable-pip-version-check "Pillow>=11,<13"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk

      - name: Rebuild generated topic hubs
        env:
          AISON_REQUIRE_SOCIAL_CARDS: '1'
        run: python tools/build.py

      - name: Verify only expected topic hubs changed
        shell: bash
        run: |
          set -euo pipefail
          expected="$(printf '%s\n'             topics/ai-agent.html             topics/ai-coding.html             topics/anthropic-claude.html             topics/google-gemini.html             topics/nvidia.html             topics/openai.html | sort)"
          actual="$(git diff --name-only -- topics/*.html | sort)"
          if [ "$actual" != "$expected" ]; then
            echo "Unexpected topic hub diff:" >&2
            printf '%s\n' "$actual" >&2
            exit 1
          fi

      - name: Commit six topic hubs and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             topics/ai-agent.html             topics/ai-coding.html             topics/anthropic-claude.html             topics/google-gemini.html             topics/nvidia.html             topics/openai.html
          git rm .github/workflows/sync-topic-hubs.yml
          git commit -m "Sync Sep 18 generated topic hubs"
          git push origin HEAD:main
