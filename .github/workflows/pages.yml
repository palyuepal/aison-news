name: Deploy AIson to GitHub Pages
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate edition before building or deploying
        run: python tools/check_deep_reads.py
      - name: Install social card renderer
        run: |
          python -m pip install --disable-pip-version-check "Pillow>=11,<13"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - name: Resolve official news images
        run: python tools/enrich_official_visuals.py --limit 20
      - name: Guarantee Top 3 story visuals
        run: python tools/ensure_top3_visuals.py
      - name: Build AIson with social cards and daily overview
        env:
          AISON_REQUIRE_SOCIAL_CARDS: '1'
        run: python tools/build.py
      - name: Build newsletter-ready daily feed
        run: python tools/build_newsletter.py
      - name: Build lightweight page payloads
        run: python tools/build_light_payloads.py
      - name: Build AIson LIVE
        run: python tools/build_live.py
      - name: Build trust and corrections log
        run: python tools/build_corrections.py
      - name: Prepare public site artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf public
          mkdir -p public
          cp -a assets data news topics public/
          cp -a *.html *.css *.js *.xml *.txt *.webmanifest CNAME public/
      - name: Inject visual news layer
        run: python tools/patch_news_visuals.py public
      - name: Version LIVE assets per deployment
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import re
          page = Path('public/live.html')
          text = page.read_text(encoding='utf-8')
          version = os.environ['DEPLOY_SHA'][:12]
          for asset in ('data/live.js', 'live-timeline.js'):
              pattern = re.escape(asset) + r'(?:\\?v=[^"\\s<]*)?'
              text, count = re.subn(pattern, asset + '?v=' + version, text)
              if count != 1:
                  raise SystemExit(f'Expected one {asset} reference, found {count}')
          page.write_text(text, encoding='utf-8')
          PY
      - name: Inject enhanced search
        run: python tools/patch_search_quality.py public
      - name: Use dated social preview URLs
        run: python tools/patch_share_meta.py public
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify public edition after deployment
        shell: bash
        run: |
          set -euo pipefail
          edition="$(TZ=Asia/Hong_Kong date +%F)"
          echo "Verifying public edition $edition after Pages deployment"
          # CDN propagation can lag a successful Pages deployment.
          # LIVE pushes can occur before the day's editorial edition is written.
          # In that case the scheduled freshness sentinel remains responsible.
          if [ ! -f "content/daily/$edition.json" ]; then
            echo "Today's source edition not available yet; skipping post-deploy edition comparison"
            exit 0
          fi
          python tools/check_freshness.py --source-only --date "$edition"
          for attempt in $(seq 1 8); do
            if python tools/check_freshness.py --live-only --date "$edition"; then
              echo "Verified: public edition matches $edition"
              exit 0
            fi
            if [ "$attempt" -lt 8 ]; then
              echo "Public edition not ready (attempt $attempt/8); retrying in 20s"
              sleep 20
            fi
          done
          echo "::error::Pages deployed, but public edition did not match $edition after 8 attempts"
          exit 1
      - name: Verify LIVE feed matches published source
        shell: bash
        run: |
          set -euo pipefail
          python tools/check_live_publish.py --source-only
          for attempt in $(seq 1 8); do
            if python tools/check_live_publish.py; then
              exit 0
            fi
            if [ "$attempt" -lt 8 ]; then
              echo "LIVE feed not propagated (attempt $attempt/8); retrying in 20s"
              sleep 20
            fi
          done
          echo "::error::Public LIVE payload does not match content/live.json"
          exit 1
