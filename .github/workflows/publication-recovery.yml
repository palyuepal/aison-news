name: Recover AIson Daily publication
on:
  schedule:
    - cron: '7,37 0-15 * * *'
  workflow_dispatch:
  workflow_run:
    workflows: [Validate AIson V3, Validate AIson Trust Layer, Validate AIson Search Quality, Validate AIson Deep Read Quality, Validate AIson PWA Return Experience]
    types: [completed]
permissions:
  contents: write
  pull-requests: write
  actions: write
concurrency:
  group: daily-publication-recovery
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      # Never check out or execute PR code in this privileged workflow_run job.
      - uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const now = new Date();
            const date = new Intl.DateTimeFormat('en-CA', {timeZone:'Asia/Hong_Kong',year:'numeric',month:'2-digit',day:'2-digit'}).format(now);
            const branch = `daily/${date.replaceAll('-','')}`;
            const paths = [`content/daily/${date}.json`, `content/editorial/${date}.json`];
            const pulls = await github.paginate(github.rest.pulls.list,{owner,repo,state:'open',head:`${owner}:${branch}`});
            if (pulls.length !== 1) { core.notice(`Expected one ${branch} PR; found ${pulls.length}. Sentinel reports missing editions.`); return; }
            const pr = (await github.rest.pulls.get({owner,repo,pull_number:pulls[0].number})).data;
            if (pr.user.login !== owner || pr.head.repo.full_name !== `${owner}/${repo}` || pr.base.ref !== 'main' || pr.draft) {
              core.setFailed('DAILY PR is not an eligible owner-authored source-only PR'); return;
            }
            const files = await github.paginate(github.rest.pulls.listFiles,{owner,repo,pull_number:pr.number});
            if (files.length !== 2 || files.some(f=> !paths.includes(f.filename) || !['added','modified'].includes(f.status))) {
              core.setFailed('DAILY PR must change exactly the two same-day source files'); return;
            }
            // Existing main content is never silently overwritten by recovery.
            for (const path of paths) {
              try { await github.rest.repos.getContent({owner,repo,path,ref:'main'}); core.setFailed(`main already contains ${path}; manual reconciliation required`); return; }
              catch (e) { if (e.status !== 404) throw e; }
            }
            const checks = (await github.rest.checks.listForRef({owner,repo,ref:pr.head.sha,per_page:100})).data.check_runs;
            const required = ['build','trust','search','deep-read-quality','pwa'];
            const selected = required.map(name=>checks.filter(c=>c.name===name).sort((a,b)=>b.id-a.id)[0]);
            if (selected.some(c=>!c)) { core.notice('Waiting for all five required checks'); return; }
            if (selected.some(c=>c.status !== 'completed')) { core.notice('Checks pending; next completed event/schedule will resume'); return; }
            if (selected.some(c=>c.conclusion !== 'success')) {
              const runs = await github.rest.actions.listWorkflowRunsForRepo({owner,repo,head_sha:pr.head.sha,event:'pull_request',per_page:100});
              for (const run of runs.data.workflow_runs) {
                if (['failure','timed_out','cancelled'].includes(run.conclusion) && run.run_attempt < 3) {
                  await github.rest.actions.reRunWorkflowFailedJobs({owner,repo,run_id:run.id});
                  core.notice(`Bounded retry ${run.run_attempt+1}/3 for ${run.html_url}`);
                }
              }
              core.setFailed('Checks not green; never bypassed. Bounded retries requested where eligible.'); return;
            }
            // Vercel/status checks and future added check gates must also be green.
            if (checks.some(c=>c.status!=='completed' || !['success','neutral','skipped'].includes(c.conclusion))) { core.notice('Waiting for other checks'); return; }
            const status = (await github.rest.repos.getCombinedStatusForRef({owner,repo,ref:pr.head.sha})).data;
            if (status.statuses.length && status.state !== 'success') { core.notice('Commit status pending or failed'); return; }
            if (!pr.mergeable || pr.mergeable_state !== 'clean') { core.notice('GitHub merge requirements not satisfied'); return; }
            const merged = await github.rest.pulls.merge({owner,repo,pull_number:pr.number,sha:pr.head.sha,merge_method:'merge'});
            if (!merged.data.merged) throw new Error('GitHub did not merge PR');
            // GITHUB_TOKEN merges do not trigger push workflows: explicitly dispatch Pages.
            await github.rest.actions.createWorkflowDispatch({owner,repo,workflow_id:'pages.yml',ref:'main'});
            core.summary.addHeading('Daily merged; public verification pending').addRaw(`PR #${pr.number}; main commit ${merged.data.sha}. Pages dispatched; sentinel verifies public receipt.`).write();
