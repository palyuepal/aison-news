name: Send AIson newsletter with Brevo

on:
  workflow_run:
    workflows:
      - Deploy AIson to GitHub Pages
    types:
      - completed

permissions:
  actions: read
  contents: read

concurrency:
  group: brevo-newsletter-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  send:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      vars.BREVO_LIST_ID != '' &&
      vars.BREVO_SENDER_EMAIL != ''
    runs-on: ubuntu-latest
    steps:
      - name: Wait for same-commit editorial checks
        id: gate
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.payload.workflow_run.head_sha;
            const required = [
              "Validate AIson V3",
              "Validate AIson Deep Read Quality",
              "Validate AIson Trust Layer",
              "Validate AIson Search Quality",
              "Validate AIson PWA Return Experience",
            ];
            const deadline = Date.now() + 15 * 60 * 1000;

            while (Date.now() < deadline) {
              const response = await github.rest.actions.listWorkflowRunsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                head_sha: sha,
                per_page: 100,
              });
              const runs = response.data.workflow_runs.filter(
                run => run.head_sha === sha && run.event === "push"
              );
              let pending = [];
              let failed = [];

              for (const name of required) {
                const matches = runs
                  .filter(run => run.name === name)
                  .sort((a, b) => b.run_number - a.run_number);
                if (matches.length === 0 || matches[0].status !== "completed") {
                  pending.push(name);
                } else if (matches[0].conclusion !== "success") {
                  failed.push(name + " (" + matches[0].conclusion + ")");
                }
              }

              if (failed.length > 0) {
                core.info("Newsletter blocked by failed validation: " + failed.join(", "));
                core.setOutput("ready", "false");
                return;
              }
              if (pending.length === 0) {
                core.info("All required validations succeeded for " + sha);
                core.setOutput("ready", "true");
                return;
              }

              core.info("Waiting for same-commit checks: " + pending.join(", "));
              await new Promise(resolve => setTimeout(resolve, 20000));
            }

            core.warning("Timed out waiting for required checks; fail closed and do not send.");
            core.setOutput("ready", "false");

      - name: Check out the exact deployed commit
        if: steps.gate.outputs.ready == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Build newsletter feed from deployed source
        if: steps.gate.outputs.ready == 'true'
        run: python3 tools/build_newsletter.py

      - name: Send today's edition through Brevo
        if: steps.gate.outputs.ready == 'true'
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_LIST_ID: ${{ vars.BREVO_LIST_ID }}
          BREVO_SENDER_EMAIL: ${{ vars.BREVO_SENDER_EMAIL }}
          BREVO_SENDER_NAME: ${{ vars.BREVO_SENDER_NAME }}
        run: python3 tools/send_brevo_newsletter.py
