name: Install bounded social renderer
description: Cache font and pin Pillow, retaining required social card rendering
runs:
  using: composite
  steps:
    - uses: actions/cache@v4
      with:
        path: ~/.cache/aison-fonts
        key: noto-cjk-ubuntu24-${{ runner.os }}-${{ runner.arch }}-v2
    - shell: bash
      timeout-minutes: 4
      run: python -m pip install --disable-pip-version-check --timeout 30 --retries 2 'Pillow==11.3.0'
    - shell: bash
      timeout-minutes: 6
      run: |
        set -euo pipefail
        cache="$HOME/.cache/aison-fonts"
        mkdir -p "$cache"
        if [ ! -s "$cache/NotoSansCJK-Regular.ttc" ] || [ ! -s "$cache/NotoSansCJK-Bold.ttc" ]; then
          sudo timeout 240 apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 update -qq
          sudo timeout 240 apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 install -y --no-install-recommends fonts-noto-cjk
          cp /usr/share/fonts/opentype/noto/NotoSansCJK-{Regular,Bold}.ttc "$cache/"
        fi
        sudo mkdir -p /usr/share/fonts/opentype/noto
        sudo cp "$cache"/*.ttc /usr/share/fonts/opentype/noto/
        fc-cache -f
